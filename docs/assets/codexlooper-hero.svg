<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">CodexLooper review-gated autonomous coding loop</title>
  <desc id="desc">Plan, code, deterministic validation, independent review, and offline benchmark evidence in a bounded loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050914"/><stop offset="0.5" stop-color="#07101f"/><stop offset="1" stop-color="#030712"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.48" stop-color="#e2e8f0"/><stop offset="0.51" stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.45" stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#38bdf8"/></marker>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.label{fill:#f8fafc;font-size:25px;font-weight:700}.sub{fill:#aebbd0;font-size:20px}.panel-title{fill:#67e8f9;font-size:20px}.panel-text{fill:#d7e0ee;font-size:18px}.tiny{fill:#94a3b8;font-size:16px}</style>
  </defs>
  <rect width="1800" height="900" rx="30" fill="url(#bg)"/>
  <ellipse cx="900" cy="455" rx="485" ry="295" fill="none" stroke="#16335f" stroke-width="3" stroke-dasharray="9 15"/>
  <path d="M560 245C710 105 1035 100 1210 240" fill="none" stroke="url(#loop)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
  <path d="M1280 340C1350 455 1325 615 1190 700" fill="none" stroke="url(#loop)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
  <path d="M1090 752C920 825 690 798 570 705" fill="none" stroke="url(#loop)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
  <path d="M475 620C410 500 425 355 530 275" fill="none" stroke="url(#loop)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
  <text x="900" y="414" text-anchor="middle" class="sans" font-size="92" font-weight="800" fill="url(#brand)">CodexLooper</text>
  <text x="900" y="468" text-anchor="middle" class="sans" font-size="31" fill="#e2e8f0">Review-gated autonomous coding loop</text>
  <text x="900" y="520" text-anchor="middle" class="sans" font-size="20" fill="#aebbd0">Deterministic validation  •  Independent AI review  •  Reproducible benchmark harness</text>
  <g transform="translate(690 557)"><rect width="420" height="94" rx="18" fill="#06151a" stroke="#10b981" stroke-width="2"/><circle cx="45" cy="47" r="23" fill="none" stroke="#34d399" stroke-width="4"/><path d="M34 47l8 8 15-19" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="40" class="sans" font-size="22" font-weight="700" fill="#34d399">LOOP CONTINUES</text><text x="82" y="67" class="sans" font-size="18" fill="#d7e0ee">until validation and review gates pass</text></g>
  <g class="sans" text-anchor="middle">
    <g transform="translate(900 118)"><circle r="58" fill="#071424" stroke="#3b82f6" stroke-width="3"/><path d="M-19 4C-31-14-14-31 1-20C12-32 33-18 24-2C34 12 17 28 3 19C-10 31-31 17-19 4Z" fill="none" stroke="#38bdf8" stroke-width="5"/><text y="94" class="label">1. PLAN</text><text y="123" class="sub">Analyze &amp; Outline</text></g>
    <g transform="translate(1320 270)"><circle r="58" fill="#071424" stroke="#06b6d4" stroke-width="3"/><path d="M-28-16L-43 0-28 16M28-16L43 0 28 16M9-28L-9 28" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/><text y="94" class="label">2. CODE</text><text y="123" class="sub">Generate Changes</text></g>
    <g transform="translate(1180 742)"><circle r="58" fill="#071424" stroke="#06b6d4" stroke-width="3"/><path d="M0-34L31-21V2C31 23 18 37 0 46C-18 37-31 23-31 2V-21Z" fill="none" stroke="#22d3ee" stroke-width="5"/><path d="M-13 5L-3 15 16-9" fill="none" stroke="#38bdf8" stroke-width="5"/><text y="94" class="label">3. VALIDATE</text><text y="123" class="sub">Deterministic Checks</text></g>
    <g transform="translate(620 742)"><circle r="58" fill="#11102a" stroke="#8b5cf6" stroke-width="3"/><rect x="-29" y="-18" width="58" height="43" rx="10" fill="none" stroke="#a78bfa" stroke-width="5"/><circle cx="-12" cy="1" r="4" fill="#c4b5fd"/><circle cx="12" cy="1" r="4" fill="#c4b5fd"/><text y="94" class="label">4. REVIEW</text><text y="123" class="sub">Independent AI Review</text></g>
    <g transform="translate(480 270)"><circle r="58" fill="#11102a" stroke="#8b5cf6" stroke-width="3"/><rect x="-28" y="9" width="11" height="25" rx="2" fill="#8b5cf6"/><rect x="-8" y="-4" width="11" height="38" rx="2" fill="#7c3aed"/><rect x="12" y="-19" width="11" height="53" rx="2" fill="#6366f1"/><text y="94" class="label">5. BENCHMARK</text><text y="123" class="sub">Offline Harness &amp; Evidence</text></g>
  </g>
  <g transform="translate(42 310)" class="sans"><rect width="285" height="270" rx="17" fill="#07111f" stroke="#244a82" stroke-width="2"/><text x="20" y="38" class="panel-title mono">pipeline.yml</text><line x1="18" y1="52" x2="267" y2="52" stroke="#193356"/><g class="panel-text"><text x="24" y="88">✓  Plan</text><text x="24" y="126">✓  Generate</text><text x="24" y="164">✓  Validate</text><text x="24" y="202">✓  Review</text><text x="24" y="240">○  Benchmark</text></g></g>
  <g transform="translate(1460 228)" class="sans"><rect width="300" height="250" rx="17" fill="#07111f" stroke="#244a82" stroke-width="2"/><text x="18" y="36" class="panel-title">validation</text><line x1="16" y1="50" x2="284" y2="50" stroke="#193356"/><g class="panel-text"><text x="20" y="85">Unit Tests</text><text x="20" y="121">Lint</text><text x="20" y="157">Type Check</text><text x="20" y="193">Secret &amp; Boundary Checks</text><text x="20" y="229">Integration Tests</text></g><g fill="#34d399" font-size="22"><text x="264" y="85">✓</text><text x="264" y="121">✓</text><text x="264" y="157">✓</text><text x="264" y="193">✓</text><text x="264" y="229">✓</text></g></g>
  <g transform="translate(1395 545)" class="sans"><rect width="365" height="264" rx="17" fill="#07111f" stroke="#244a82" stroke-width="2"/><text x="18" y="37" class="panel-title">benchmark evidence</text><line x1="16" y1="51" x2="349" y2="51" stroke="#193356"/><g class="panel-text"><text x="18" y="87">Deterministic Fixtures</text><text x="18" y="129">Hidden Verifier Isolation</text><text x="18" y="171">Reproducible Runs</text><text x="18" y="219">Real Model Benchmark</text></g><g class="sans" font-size="15" font-weight="700" text-anchor="middle"><rect x="290" y="66" width="58" height="26" rx="8" fill="#052e2a" stroke="#10b981"/><text x="319" y="85" fill="#34d399">PASS</text><rect x="290" y="108" width="58" height="26" rx="8" fill="#052e2a" stroke="#10b981"/><text x="319" y="127" fill="#34d399">PASS</text><rect x="290" y="150" width="58" height="26" rx="8" fill="#052e2a" stroke="#10b981"/><text x="319" y="169" fill="#34d399">PASS</text><rect x="222" y="198" width="126" height="30" rx="8" fill="#1b1236" stroke="#8b5cf6"/><text x="285" y="218" fill="#c4b5fd" font-size="13">BLOCKED · GATE B</text></g></g>
  <text x="900" y="875" text-anchor="middle" class="sans tiny">Local-first • bounded authority • evidence before claims</text>
</svg>